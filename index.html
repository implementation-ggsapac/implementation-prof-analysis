<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IR Professional Data Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// Chart.js global defaults
Chart.defaults.borderColor = '#E2E8F0';
Chart.defaults.color = '#475569';
Chart.defaults.font.family = 'Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
Chart.defaults.font.size = 11;
Chart.defaults.elements.bar.borderRadius = 3;
Chart.defaults.elements.bar.borderSkipped = false;
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.pointStyle = 'rectRounded';
Chart.defaults.plugins.legend.labels.padding = 16;
Chart.defaults.scale.grid = { color: '#F1F5F9', lineWidth: 1 };
Chart.defaults.devicePixelRatio = 3;
Chart.defaults.responsive = true;
Chart.defaults.maintainAspectRatio = true;
</script>
<style>
:root{
  /* Regions — semantic, consistent everywhere */
  --r-apac:#1D4ED8;--r-apac-light:#DBEAFE;--r-apac-mid:#93C5FD;
  --r-int:#047857;--r-int-light:#D1FAE5;--r-int-mid:#6EE7B7;
  --r-us:#B45309;--r-us-light:#FEF3C7;--r-us-mid:#FCD34D;
  /* Types — NCC vs OPT, fixed pair */
  --t-ncc:#6366F1;--t-ncc-light:#EEF2FF;--t-ncc-mid:#A5B4FC;
  --t-opt:#EA580C;--t-opt-light:#FFF7ED;--t-opt-mid:#FDBA74;
  /* Semantic */
  --c-success:#059669;--c-success-light:#D1FAE5;
  --c-danger:#DC2626;--c-danger-light:#FEE2E2;
  /* Neutrals */
  --c-text:#0F172A;--c-text-secondary:#475569;--c-text-muted:#94A3B8;
  --c-border:#E2E8F0;--c-bg:#F8FAFC;--c-card:#FFFFFF;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.05)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;font-size:18px;-webkit-font-smoothing:antialiased}
.container{max-width:1680px;margin:0 auto;padding:24px 32px}
h1{text-align:center;margin-bottom:24px;font-size:1.6em;font-weight:800;color:var(--c-text);letter-spacing:-.02em}
h1 .accent{color:var(--r-apac)}
.upload-zone{border:2px dashed var(--c-border);border-radius:var(--radius);padding:48px;text-align:center;background:var(--c-card);cursor:pointer;transition:.2s}
.upload-zone:hover{border-color:var(--r-apac);background:var(--r-apac-light);box-shadow:var(--shadow)}
.upload-zone input[type="file"]{display:none}
.upload-zone .icon{font-size:2.5em;margin-bottom:8px}
.mode-selector{display:none;text-align:center;margin:24px 0;display:none;gap:12px;justify-content:center}
.mode-selector button{padding:14px 36px;margin:0 8px;border:none;border-radius:var(--radius);font-size:.95em;cursor:pointer;font-weight:700;transition:.15s;letter-spacing:-.01em}
.mode-selector button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.btn-ic{background:var(--r-apac);color:#fff}
.btn-mgmt{background:var(--r-int);color:#fff}
.file-info{display:none;text-align:center;margin:12px 0;padding:10px 16px;background:var(--c-success-light);border-radius:8px;font-size:.82em;border:1px solid #A7F3D0}
.file-info .reset-btn{margin-left:12px;cursor:pointer;color:var(--c-danger);font-weight:600;font-size:.9em}
#dashboard,#mgmt-dashboard{display:none}
/* Cards */
.card{background:var(--c-card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px;border:1px solid var(--c-border)}
.card h3{margin-bottom:14px;font-size:.88em;color:var(--c-text);font-weight:700;letter-spacing:-.01em}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.kpi-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.kpi{background:var(--c-card);border-radius:var(--radius);padding:14px 16px;flex:1;min-width:120px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--c-border)}
.kpi .lbl{font-size:.68em;color:var(--c-text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .val{font-size:1.45em;font-weight:800;color:var(--c-text);letter-spacing:-.02em}
.kpi .val.good{color:var(--c-success)}.kpi .val.warn{color:var(--r-us)}.kpi .val.bad{color:var(--c-danger)}
.kpi .sub{font-size:.65em;color:var(--c-text-muted);margin-top:2px}
.kpi .trend{font-size:.7em;margin-top:3px;font-weight:700}
.kpi .trend.up{color:var(--c-success)}.kpi .trend.down{color:var(--c-danger)}.kpi .trend.flat{color:var(--c-text-muted)}
/* Type badges — NCC/OPT */
.badge-ncc{background:var(--t-ncc-light);color:var(--t-ncc);padding:2px 8px;border-radius:4px;font-size:.72em;font-weight:700}
.badge-opt{background:var(--t-opt-light);color:var(--t-opt);padding:2px 8px;border-radius:4px;font-size:.72em;font-weight:700}
.trend-controls{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.trend-controls label{font-size:.75em;color:var(--c-text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.trend-controls select{padding:5px 10px;border:1px solid var(--c-border);border-radius:6px;font-size:.82em;background:var(--c-card);cursor:pointer}
.trend-controls select:hover{border-color:var(--r-apac)}
/* Region Cards */
.region-card{border-radius:var(--radius);padding:18px;background:var(--c-card);box-shadow:var(--shadow);border:1px solid var(--c-border);position:relative;overflow:hidden}
.region-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.region-card.apac::before{background:var(--r-apac)}
.region-card.int::before{background:var(--r-int)}
.region-card.us::before{background:var(--r-us)}
.region-card h4{text-align:center;padding:4px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--c-border);font-size:.92em;font-weight:700}
.region-card.apac h4{color:var(--r-apac)}
.region-card.int h4{color:var(--r-int)}
.region-card.us h4{color:var(--r-us)}
.mrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F1F5F9;font-size:.82em}
.mrow:last-child{border-bottom:none}
.mrow .ml{color:var(--c-text-secondary)}.mrow .mv{font-weight:700;font-variant-numeric:tabular-nums}
.bps-pos{color:var(--c-success)}.bps-neg{color:var(--c-danger)}.bps-0{color:var(--c-text-muted)}
.reg-apac{color:var(--r-apac);font-weight:700}
.reg-int{color:var(--r-int);font-weight:700}
.reg-us{color:var(--r-us);font-weight:700}

/* Tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.8em}
th,td{padding:9px 12px;text-align:left}
th{background:#F8FAFC;font-weight:700;white-space:nowrap;color:var(--c-text-secondary);text-transform:uppercase;font-size:.68em;letter-spacing:.4px;border-bottom:2px solid var(--c-border)}
td{border-bottom:1px solid #F1F5F9;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:#FAFBFD}
tbody tr:hover{background:#F0F7FF}
.tag-adopted{background:var(--c-success-light);color:var(--c-success);padding:2px 8px;border-radius:4px;font-size:.75em;font-weight:700}
.tag-not{background:var(--c-danger-light);color:var(--c-danger);padding:2px 8px;border-radius:4px;font-size:.75em;font-weight:700}
/* Inline progress bar for ADR in tables */
.inline-bar{display:inline-flex;align-items:center;gap:6px}
.inline-bar .bar{width:60px;height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden}
.inline-bar .bar .fill{height:100%;border-radius:3px;transition:width .3s}
/* Buttons */
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.78em;font-weight:600;transition:.15s;letter-spacing:.01em}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--r-apac);color:#fff}.btn-p:hover{background:#1E40AF}
.btn-s{background:#F1F5F9;color:var(--c-text-secondary);border:1px solid var(--c-border)}.btn-s:hover{background:#E2E8F0}
.btn-g{background:var(--c-success);color:#fff}.btn-g:hover{background:#047857}
.btn-v{background:var(--t-ncc);color:#fff}.btn-v:hover{background:#4F46E5}
.back-btn{padding:8px 16px;background:#F1F5F9;color:var(--c-text-secondary);border:1px solid var(--c-border);border-radius:8px;cursor:pointer;margin-bottom:16px;font-size:.8em;font-weight:600;transition:.15s}
.back-btn:hover{background:#E2E8F0}
/* Multi-select dropdown */
.ms-wrap{position:relative}
.ms-btn{width:100%;padding:7px 10px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-card);cursor:pointer;font-size:.82em;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.ms-btn:hover{border-color:var(--r-apac);box-shadow:0 0 0 3px var(--r-apac-light)}
.ms-btn:after{content:'▾';float:right;color:var(--c-text-muted)}
.ms-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;max-height:240px;overflow:hidden;flex-direction:column}
.ms-drop.open{display:flex}
.ms-search{padding:8px 10px;border:none;border-bottom:1px solid var(--c-border);font-size:.82em;outline:none;width:100%;background:#F8FAFC}
.ms-search:focus{background:#fff;box-shadow:inset 0 -2px 0 var(--r-apac)}
.ms-list{overflow-y:auto;flex:1;padding:4px 0}
.ms-item{padding:4px 10px;font-size:.8em;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.1s}
.ms-item:hover{background:var(--r-apac-light)}
.ms-item input{margin:0;accent-color:var(--r-apac)}
.ms-actions{display:flex;border-top:1px solid var(--c-border);padding:6px 10px;gap:6px;background:#F8FAFC}
.ms-actions button{font-size:.72em;padding:3px 8px;border:1px solid var(--c-border);border-radius:4px;cursor:pointer;background:#fff;font-weight:600;transition:.15s}
.ms-actions button:hover{background:var(--r-apac-light);border-color:var(--r-apac);color:var(--r-apac)}
/* Analysis blocks */
.analysis{background:#FAFBFE;border:1px solid #E8EEFF;border-radius:var(--radius);padding:18px;margin-bottom:16px}
.analysis h4{margin-bottom:10px;font-size:.86em;color:var(--c-text);font-weight:700;letter-spacing:-.01em}
.analysis canvas{max-height:260px}
/* Deep Dive */
.dd-panel{border-left:4px solid var(--t-ncc);padding-left:20px;background:linear-gradient(135deg,#FAFBFF,#F5F7FF)}
.dd-filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:14px}
.dd-filters .fg{display:flex;flex-direction:column;gap:3px}
.dd-filters .fg label{font-size:.68em;color:var(--c-text-secondary);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
/* Depth bars */
.depth-bar-wrap{display:flex;align-items:center;gap:8px;min-width:180px}
.depth-bar-track{flex:1;height:18px;background:#F0F2F5;border-radius:9px;overflow:hidden}
.depth-bar-fill{height:100%;border-radius:9px;transition:width .4s}.depth-bar-fill.dg{background:linear-gradient(90deg,#059669,#10B981)}.depth-bar-fill.do{background:linear-gradient(90deg,#D97706,#F59E0B)}.depth-bar-fill.dr{background:linear-gradient(90deg,#DC2626,#EF4444)}
.depth-pct{font-weight:700;font-size:.8em;min-width:48px;text-align:right}.depth-pct.dg{color:#059669}.depth-pct.do{color:#D97706}.depth-pct.dr{color:#DC2626}
/* IC Tables */
.ic-tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto}
.ic-tbl{width:100%;border-collapse:collapse;font-size:.8em}
.ic-tbl th{background:var(--r-apac);color:#fff;padding:9px 12px;text-align:left;font-weight:600;white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:2;font-size:.72em;text-transform:uppercase;letter-spacing:.4px}
.ic-tbl th:hover{background:#1E40AF}
.ic-tbl td{padding:8px 12px;border-bottom:1px solid var(--c-border)}
.ic-tbl tr:hover td{background:#EFF6FF}
.ic-tbl tr.rna td{background:#FFF8F8}
.ic-tbl tr.rna:hover td{background:#FFECEC}
.badge-ad{background:var(--c-success-light);color:var(--c-success);padding:3px 8px;border-radius:10px;font-size:.72em;font-weight:700}
.badge-na{background:var(--c-danger-light);color:var(--c-danger);padding:3px 8px;border-radius:10px;font-size:.72em;font-weight:700}
.ic-search{border:1px solid var(--c-border);border-radius:8px;padding:7px 12px;font-size:.82em;width:200px;outline:none;transition:.2s}
.ic-search:focus{border-color:var(--r-apac);box-shadow:0 0 0 3px var(--r-apac-light)}
.ic-pg{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:.78em;color:var(--c-text-secondary)}
.ic-pg-btns{display:flex;gap:4px}
.ic-pg-btn{background:var(--c-bg);border:1px solid var(--c-border);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.78em;font-weight:600;transition:.15s}
.ic-pg-btn:hover{background:var(--r-apac);color:#fff;border-color:var(--r-apac)}
.ic-pg-btn.active{background:var(--r-apac);color:#fff;border-color:var(--r-apac)}
.ic-pg-btn:disabled{opacity:.4;cursor:not-allowed}
.ic-filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ic-filter-bar label{font-size:.78em;font-weight:600;color:var(--c-text-secondary)}
.ic-filter-bar select{padding:5px 10px;border:1px solid var(--c-border);border-radius:6px;font-size:.82em}
.ic-cnts{display:flex;gap:6px;font-size:.72em;flex-wrap:wrap}
.ic-cnt{padding:3px 8px;border-radius:10px;font-weight:600}
.ic-cnt.tt{background:var(--r-apac-light);color:var(--r-apac)}
.ic-cnt.gn{background:var(--c-success-light);color:var(--c-success)}
.ic-cnt.og{background:var(--r-us-light);color:var(--r-us)}
.ic-cnt.rd{background:var(--c-danger-light);color:var(--c-danger)}
.psaViewTab.active{background:var(--r-apac);color:#fff;border-color:var(--r-apac)}
.ic-tbl th[data-psort]{cursor:pointer}.ic-tbl th[data-psort]:hover{background:#1E40AF}
/* Tooltip */
.tip{position:relative}.tip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:6px 12px;border-radius:6px;font-size:.72em;white-space:pre-wrap;max-width:400px;z-index:100;pointer-events:none;font-weight:400;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tip:hover::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#1E293B;z-index:100}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>IR Professional Data Analysis</h1>
<div class="upload-zone" id="uploadZone"><div class="icon">📁</div><p>Click to upload or drag & drop CSV</p><input type="file" id="fileInput" accept=".csv"></div>
<div class="file-info" id="fileInfo"><span id="fileName"></span><span class="reset-btn" id="resetBtn">✕ Reset</span></div>
<div class="mode-selector" id="modeSelector">
  <button class="btn-ic" id="btnIC">🔬 IC View</button>
  <button class="btn-mgmt" id="btnMgmt">🏢 Management View</button>
</div>
<!-- IC View placeholder -->
<div id="dashboard"><button class="back-btn" id="backIC">← Back</button><div id="icContent"></div></div>
<!-- Management View -->
<div id="mgmt-dashboard">
  <button class="back-btn" id="backMgmt">← Back</button>
  <div id="mgmtContent"></div>
</div>
</div>
<script>
var rawData=[],charts={};
// === CSV & Date ===
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');
  var l=t.split(/\r?\n/);if(l.length<2)return[];
  var h=pL(l[0]).map(function(s){return s.replace(/[^\x20-\x7E\u00A0-\uFFFF]/g,'').trim()});
  var d=[];
  for(var i=1;i<l.length;i++){if(!l[i].trim())continue;var v=pL(l[i]);var r={};for(var j=0;j<h.length;j++){r[h[j]]=(v[j]||'').trim()}d.push(r)}
  return d;
}
function pL(l){var r=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"'){q=false}else{c+=ch}}else{if(ch==='"'){q=true}else if(ch===','){r.push(c);c=''}else{c+=ch}}}r.push(c);return r}
function pD(s){
  if(!s||!s.trim())return null;
  var clean=s.trim().split(' ')[0].trim();
  if(clean.indexOf('-')>0){var p=clean.split('-');if(p.length===3){var y=+p[0],m=+p[1]-1,d=+p[2];if(y>2000&&m>=0&&d>0)return new Date(y,m,d)}}
  if(clean.indexOf('/')>0){var p2=clean.split('/');if(p2.length===3){var m2=+p2[0]-1,d2=+p2[1],y2=+p2[2];if(y2>2000&&m2>=0&&d2>0)return new Date(y2,m2,d2)}}
  return null;
}
function fmt(d){if(!d)return'';var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd}
function pct(v){return(v*100).toFixed(1)+'%'}
function bStr(v){return(v>0?'▲ +':v<0?'▼ ':'')+v.toFixed(0)+' bps'}
function regSpan(r){var cls=r==='APAC'?'reg-apac':r==='INT'?'reg-int':'reg-us';return'<span class="'+cls+'">'+r+'</span>'}
function bCls(v){return v>0?'bps-pos':v<0?'bps-neg':'bps-0'}
function getWeek(d){if(!d)return'';var yr=d.getFullYear();var jan1=new Date(yr,0,1);var jan1Day=jan1.getDay();var wk1Sun=new Date(yr,0,1-jan1Day);var diff=Math.floor((d-wk1Sun)/864e5);return'W'+String(Math.floor(diff/7)+1).padStart(2,'0')}
function gR(r){var g=(r['AST Region']||'').toUpperCase();if(g==='US'||g==='NA')return'US';if(g==='INT')return'INT';return'APAC'}
function destroyC(){for(var k in charts){if(charts[k]&&charts[k].destroy)charts[k].destroy()}charts={}}

// === Multi-Select Dropdown Component ===
function createMS(containerId, label, values){
  var wrap=document.createElement('div');wrap.className='fg';
  wrap.innerHTML='<label>'+label+'</label><div class="ms-wrap"><div class="ms-btn" data-id="'+containerId+'">All</div><div class="ms-drop" id="drop_'+containerId+'"><input class="ms-search" placeholder="Search..."><div class="ms-list"></div><div class="ms-actions"><button data-act="all">Select All</button><button data-act="none">Clear</button><button data-act="done">Done</button></div></div></div>';
  var list=wrap.querySelector('.ms-list');
  values.forEach(function(v){
    var item=document.createElement('label');item.className='ms-item';
    item.innerHTML='<input type="checkbox" value="'+v.replace(/"/g,'&quot;')+'" checked> '+v;
    list.appendChild(item);
  });
  // Events
  var btn=wrap.querySelector('.ms-btn'),drop=wrap.querySelector('.ms-drop'),search=wrap.querySelector('.ms-search');
  btn.onclick=function(e){e.stopPropagation();var allDrops=document.querySelectorAll('.ms-drop.open');for(var i=0;i<allDrops.length;i++){if(allDrops[i]!==drop)allDrops[i].classList.remove('open')}drop.classList.toggle('open')};
  search.onclick=function(e){e.stopPropagation()};
  search.oninput=function(){var q=search.value.toLowerCase();var items=list.querySelectorAll('.ms-item');for(var i=0;i<items.length;i++){items[i].style.display=items[i].textContent.toLowerCase().indexOf(q)>=0?'':'none'}};
  wrap.querySelector('[data-act="all"]').onclick=function(e){e.stopPropagation();var cbs=list.querySelectorAll('input');for(var i=0;i<cbs.length;i++){if(cbs[i].parentElement.style.display!=='none')cbs[i].checked=true}updBtn(btn,list)};
  wrap.querySelector('[data-act="none"]').onclick=function(e){e.stopPropagation();var cbs=list.querySelectorAll('input');for(var i=0;i<cbs.length;i++){cbs[i].checked=false}updBtn(btn,list)};
  wrap.querySelector('[data-act="done"]').onclick=function(){drop.classList.remove('open')};
  list.onclick=function(e){e.stopPropagation()};list.onchange=function(){updBtn(btn,list)};
  return wrap;
}
function updBtn(btn,list){var cbs=list.querySelectorAll('input');var total=cbs.length;var checked=0;for(var i=0;i<cbs.length;i++){if(cbs[i].checked)checked++}if(checked===total||checked===0)btn.textContent='All ('+total+')';else if(checked<=2){var names=[];for(var i=0;i<cbs.length;i++){if(cbs[i].checked)names.push(cbs[i].value)}btn.textContent=names.join(', ')}else btn.textContent=checked+'/'+total+' selected'}

function handleFile(f){
  if(!f||!f.name.endsWith('.csv')){alert('Please upload a CSV file');return}
  document.getElementById('uploadZone').innerHTML='<div class="icon">⏳</div><p>Processing '+f.name+'...</p>';
  var reader=new FileReader();
  reader.onload=function(e){
    rawData=parseCSV(e.target.result);
    if(!rawData.length){alert('Parse failed');document.getElementById('uploadZone').innerHTML='<div class="icon">📁</div><p>Click to upload or drag & drop CSV</p>';return}
    var cols=Object.keys(rawData[0]);
    // Flexible column matching: find columns by keywords regardless of naming changes
    function findCol(keywords,exclude){
      var kws=keywords.map(function(k){return k.toLowerCase()});
      var exl=(exclude||[]).map(function(k){return k.toLowerCase()});
      for(var i=0;i<cols.length;i++){
        var cl=cols[i].toLowerCase();
        var match=true;
        for(var j=0;j<kws.length;j++){if(cl.indexOf(kws[j])<0){match=false;break}}
        if(!match)continue;
        var excluded=false;
        for(var j=0;j<exl.length;j++){if(cl.indexOf(exl[j])>=0){excluded=true;break}}
        if(!excluded)return cols[i];
      }
      return null;
    }
    var dateCol=findCol(['delivered','date'])||cols[0];
    var caseIdCol=findCol(['case','id'],['flag'])||'Case ID';
    var recIdCol=findCol(['recommendation','id'],['flag','updated'])||'Recommendation ID';
    var caseAdoptCol=findCol(['case','flag'],['aris'])||'Case Adoption Flag';
    var adoptFlagCol=findCol(['flag'],['case','weekend','monthend','quarterend','aris','proactive','first','updated','apb'])||'Adoption Flag';
    var delCampCol=findCol(['delivered','campaign'],['ncc','line'])||'# Delivered Campaign';
    var adpCampCol=findCol(['campaign'],['delivered','ncc','line'])||'# Adoption Campaign';
    var nccDelCol=findCol(['ncc','delivered'])||'# NCC - Delivered Campaign';
    var delLiCol=findCol(['delivered','line'])||'# Delivered Line Item';
    var adpLiCol=findCol(['line','item'],['delivered'])||'# Adopted Line Item';
    var recOpenCol=findCol(['recommendation','open','date'])||'Recommendation Open Date';
    var weekendDayCol=findCol(['weekend','day'])||'';
    var nccAdpCol=findCol(['ncc','campaign'],['delivered'])||'';
    var segCol=findCol(['segment'])||'';
    window._segCol=segCol;
    // Store column mapping for reference
    window._colMap={dateCol:dateCol,caseIdCol:caseIdCol,recIdCol:recIdCol,caseAdoptCol:caseAdoptCol,adoptFlagCol:adoptFlagCol,delCampCol:delCampCol,adpCampCol:adpCampCol,nccDelCol:nccDelCol,nccAdpCol:nccAdpCol,delLiCol:delLiCol,adpLiCol:adpLiCol,recOpenCol:recOpenCol};

    var parsed=0;
    rawData.forEach(function(row){
      var d=pD(row[dateCol]);
      row['_date']=d;
      var wkSat=weekendDayCol?pD(row[weekendDayCol]):null;
      row['_wkSat']=wkSat;
      row['_week']=wkSat?getWeek(wkSat):getWeek(d);
      row['_reg']=gR(row);
      row['_seg']=segCol?(row[segCol]||'(No Segment)'):'(No Segment)';
      row['_cid']=row[caseIdCol]||'';
      row['_rid']=row[recIdCol]||'';
      row['_caf']=+row[caseAdoptCol]||0;
      row['_af']=+row[adoptFlagCol]||0;
      row['_dc']=+row[delCampCol]||0;
      row['_ac']=+row[adpCampCol]||0;
      row['_ncc']=+row[nccDelCol]||0;
      row['_dli']=+row[delLiCol]||0;
      row['_ali']=+row[adpLiCol]||0;
      row['_nca']=nccAdpCol?+row[nccAdpCol]||0:0;
      row['Recommendation Open Date']=row[recOpenCol]||'';
      if(d)parsed++;
    });
    document.getElementById('fileName').textContent='📄 '+f.name+' — '+rawData.length+' rows ('+parsed+' dates)';
    UZ.style.display='none';
    document.getElementById('fileInfo').style.display='block';
    document.getElementById('modeSelector').style.display='block';
  };
  reader.readAsText(f);
}

// === Shared Calc Functions (optimized with pre-computed fields) ===
function calcMetrics(data,d0,d1){
  var cs={},recs={},i,r,cid,rid,c;
  var touchedAccts={};
  for(i=0;i<data.length;i++){r=data[i];if(!r['_date']||r['_date']<d0||r['_date']>=d1)continue;
    cid=r['_cid'];if(cid){if(!cs[cid])cs[cid]={f:0,op:false,dli:0,ali:0,acct:r['SF Account ID']||''};c=cs[cid];if(r['_caf']===1)c.f=1;if(r['Recommendation Open Date'])c.op=true;c.dli+=r['_dli'];c.ali+=r['_ali']}
    rid=r['_rid'];if(rid){if(!recs[rid])recs[rid]=0;if(r['_af']===1)recs[rid]=1}
    var aid=r['SF Account ID'];if(aid)touchedAccts[aid]=true;
  }
  // Count report cases separately (do NOT affect metrics calculations)
  // Only count report cases whose account belongs to the same region as the data
  var rptCaseCnt=0,rptAcctsObj={};
  if(window._reportCases){
    var rptD0,rptD1;
    var ddFrom=document.getElementById('ddDateFrom'),ddTo=document.getElementById('ddDateTo');
    var ddF=ddFrom?pD(ddFrom.value):null,ddT=ddTo?pD(ddTo.value):null;
    if(ddF&&ddT){rptD0=ddF;rptD1=new Date(ddT.getTime()+864e5)}
    else{
      var rawMin=null,rawMax=null;
      for(i=0;i<data.length;i++){var dd2=data[i]['_date'];if(dd2){if(!rawMin||dd2<rawMin)rawMin=dd2;if(!rawMax||dd2>rawMax)rawMax=dd2}}
      rptD0=rawMin||d0;rptD1=rawMax?new Date(rawMax.getTime()+864e5):d1;
    }
    // Only count report cases whose account region matches the data's regions
    var dataRegs={};for(i=0;i<data.length;i++){dataRegs[data[i]['_reg']]=true}
    for(var rAid in window._reportCases){
      if(window._tagRegMapping){
        var rAidReg=(window._tagRegMapping[rAid]||'').toUpperCase();
        if(rAidReg==='NA'||rAidReg==='US')rAidReg='US';
        else if(rAidReg==='INT')rAidReg='INT';
        else if(rAidReg==='APAC')rAidReg='APAC';
        else continue;
        if(!dataRegs[rAidReg])continue;
      }
      var rptArr=window._reportCases[rAid];
      var acctHasRpt=false;
      for(var ri2=0;ri2<rptArr.length;ri2++){
        var rpt=rptArr[ri2];
        if(!rpt.date)continue;
        if(rpt.date<rptD0||rpt.date>=rptD1)continue;
        if(!cs[rpt.cid]){rptCaseCnt++;acctHasRpt=true}
      }
      if(acctHasRpt)rptAcctsObj[rAid]=true;
    }
  }
  var tC=0,aC=0,dA=0,dD=0,opC=0,opAC=0,adoptedAccts={};
  for(cid in cs){c=cs[cid];tC++;if(c.f===1){aC++;dA+=c.ali;dD+=c.dli;if(c.acct)adoptedAccts[c.acct]=true}if(c.op){opC++;if(c.f===1)opAC++}}
  var tR=0,aR=0;for(rid in recs){tR++;if(recs[rid]===1)aR++}
  var tCdisplay=tC+rptCaseCnt;
  return{cADR:tC>0?aC/tC:0,rADR:tR>0?aR/tR:0,dep:dD>0?dA/dD:0,opR:tC>0?opC/tC:0,opA:opC>0?opAC/opC:0,tC:tCdisplay,tCraw:tC,aC:aC,tR:tR,aR:aR,dD:dD,dA:dA,opC:opC,opAC:opAC,rptCases:rptCaseCnt,adoptedAccts:Object.keys(adoptedAccts).length,rptAccts:Object.keys(rptAcctsObj).length}
}
function calcNccOpt(data){
  var nRecs={},oRecs={},i,r,rid;
  for(i=0;i<data.length;i++){r=data[i];rid=r['_rid'];if(!rid)continue;
    if(r['_ncc']>0){if(!nRecs[rid])nRecs[rid]=0;if(r['_af']===1)nRecs[rid]=1}
    else{if(!oRecs[rid])oRecs[rid]=0;if(r['_af']===1)oRecs[rid]=1}
  }
  var nT=0,nA=0,oT=0,oA=0;
  for(rid in nRecs){nT++;if(nRecs[rid]===1)nA++}
  for(rid in oRecs){oT++;if(oRecs[rid]===1)oA++}
  return{ncc:{del:nT,adp:nA,adr:nT>0?nA/nT:0},opt:{del:oT,adp:oA,adr:oT>0?oA/oT:0}}
}

function renderIcPg(containerId,tp,cp,cb){

  var sp=Math.max(1,cp-2),ep=Math.min(tp,cp+2);

}

  // Fuzzy name match: extract alpha tokens, sort, compare
  function nameKey(s){return(s||'').replace(/\(.*?\)/g,'').replace(/[^a-zA-Z\s,]/g,'').toLowerCase().split(/[\s,]+/).filter(function(t){return t.length>1}).sort().join(' ')}
  function fuzzyMatchM1(mappingM1,rawM1Names){
    var mk=nameKey(mappingM1);
    for(var i=0;i<rawM1Names.length;i++){if(nameKey(rawM1Names[i])===mk)return rawM1Names[i]}
    // Partial match: check if all tokens from mapping exist in raw name
    var mTokens=mk.split(' ');
    for(var i=0;i<rawM1Names.length;i++){var rk=nameKey(rawM1Names[i]);var match=true;for(var j=0;j<mTokens.length;j++){if(rk.indexOf(mTokens[j])<0){match=false;break}}if(match)return rawM1Names[i]}
    return null;
  }

function runDDCompare(data){
  // Get period A and B data
  function getPeriodData(prefix){
    var mode=document.getElementById('ddCmp'+prefix+'Mode').value;
    if(mode==='week'){
      var wk=document.getElementById('ddCmp'+prefix+'Wk').value;
      return data.filter(function(r){return r['_week']===wk});
    }else{
      var from=pD(document.getElementById('ddCmp'+prefix+'From').value);
      var to=pD(document.getElementById('ddCmp'+prefix+'To').value);
      if(!from||!to)return[];
      to=new Date(to.getTime()+864e5);
      return data.filter(function(r){return r['_date']&&r['_date']>=from&&r['_date']<to});
    }
  }
  var dataA=getPeriodData('A'),dataB=getPeriodData('B');
  if(!dataA.length&&!dataB.length){document.getElementById('ddResults').innerHTML='<p style="color:#e74c3c;text-align:center">No data in selected periods</p>';return}

  var bdCol=document.getElementById('ddBD').value;
  var labelA=document.getElementById('ddCmpAMode').value==='week'?document.getElementById('ddCmpAWk').value:'Period A';
  var labelB=document.getElementById('ddCmpBMode').value==='week'?document.getElementById('ddCmpBWk').value:'Period B';

  // Compute metrics per dimension for both periods
  function computeByDim(pData){
    var groups={};for(var i=0;i<pData.length;i++){var k=pData[i][bdCol]||'(empty)';if(!groups[k])groups[k]=[];groups[k].push(pData[i])}
    var result={};
    for(var key in groups){
      var rows=groups[key];var gm=calcMetrics(rows,new Date(2000,0,1),new Date(2100,0,1));
      var nO=calcNccOpt(rows);
      var ld=0,la=0;for(var li=0;li<rows.length;li++){ld+=rows[li]['_dli'];la+=rows[li]['_ali']}
      result[key]={tC:gm.tC,aC:gm.aC,cA:gm.cADR,rA:gm.rADR,dep:gm.dep,liAdr:ld>0?la/ld:0,ncc:nO.ncc.adr,opt:nO.opt.adr};
    }
    return result;
  }
  var metricsA=computeByDim(dataA),metricsB=computeByDim(dataB);
  var allKeys={};for(var k in metricsA)allKeys[k]=true;for(var k in metricsB)allKeys[k]=true;
  var keys=Object.keys(allKeys).sort();

  var h='<div style="font-size:.75em;color:#666;margin-bottom:8px"><strong style="color:var(--t-ncc)">'+labelA+'</strong> vs <strong style="color:var(--t-opt)">'+labelB+'</strong> | '+keys.length+' groups by '+bdCol+'</div>';
  h+='<div style="overflow-x:auto;max-height:450px;overflow-y:auto"><table class="ic-tbl"><thead><tr><th>'+bdCol+'</th><th>'+labelA+' Case IR</th><th>'+labelB+' Case IR</th><th>Diff (bps)</th><th>'+labelA+' Rec IR</th><th>'+labelB+' Rec IR</th><th>Diff</th><th>'+labelA+' Depth</th><th>'+labelB+' Depth</th><th>Diff</th></tr></thead><tbody>';
  keys.forEach(function(key){
    var a=metricsA[key]||{cA:0,rA:0,dep:0};
    var b=metricsB[key]||{cA:0,rA:0,dep:0};
    var cDiff=(a.cA-b.cA)*1e4,rDiff=(a.rA-b.rA)*1e4,dDiff=(a.dep-b.dep)*1e4;
    h+='<tr><td style="font-weight:600">'+key+'</td>';
    h+='<td style="color:var(--t-ncc)">'+pct(a.cA)+'</td><td style="color:var(--t-opt)">'+pct(b.cA)+'</td><td class="'+bCls(cDiff)+'">'+bStr(cDiff)+'</td>';
    h+='<td style="color:var(--t-ncc)">'+pct(a.rA)+'</td><td style="color:var(--t-opt)">'+pct(b.rA)+'</td><td class="'+bCls(rDiff)+'">'+bStr(rDiff)+'</td>';
    h+='<td style="color:var(--t-ncc)">'+pct(a.dep)+'</td><td style="color:var(--t-opt)">'+pct(b.dep)+'</td><td class="'+bCls(dDiff)+'">'+bStr(dDiff)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('ddResults').innerHTML=h;
}

function renderDDRaw(){
  var data=window._ddRawData,cols=window._ddRawCols,ps=window._ddRawPS,page=window._ddRawPage;
  var t=data.length,tp=Math.max(1,Math.ceil(t/ps));if(page>tp)page=window._ddRawPage=tp;
  var s=(page-1)*ps,e=Math.min(s+ps,t);var tb=document.getElementById('ddRawTbd');tb.innerHTML='';
  for(var i=s;i<e;i++){var r=data[i],row='<tr>';cols.forEach(function(c){row+='<td style="white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:.75em" title="'+(r[c]||'').replace(/"/g,'&quot;')+'">'+(r[c]||'')+'</td>'});row+='</tr>';tb.innerHTML+=row}
  document.getElementById('ddRawInf').textContent=(t>0?s+1:0)+'-'+e+' of '+t;
  renderIcPg('ddRawPg',tp,page,function(p){window._ddRawPage=p;renderDDRaw()});
}

function dlCSV(rows,fn){var csv=rows.map(function(r){return r.map(function(v){return'"'+String(v||'').replace(/"/g,'""')+'"'}).join(',')}).join('\n');var b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click()}
function printTableToPdf(wrapId,title){var el=document.getElementById(wrapId);if(!el||!el.innerHTML.trim()){alert('No table to export');return}var w=window.open('','_blank');if(!w){alert('Popup blocked — allow popups to export PDF');return}w.document.write('<html><head><title>'+title+'</title><style>body{font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px;color:#0F172A}h2{font-size:16px;margin:0 0 12px}table{border-collapse:collapse;width:100%}@page{size:landscape}</style></head><body><h2>'+title+'</h2>'+el.innerHTML+'</body></html>');w.document.close();w.focus();setTimeout(function(){w.print()},300)}

</script>
